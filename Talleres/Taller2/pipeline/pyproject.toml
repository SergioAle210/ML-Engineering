[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-prep-pipeline"
version = "0.7.0"
description = "Reusable scikit-learn data preparation pipeline for the customer churn use case (Taller 2: dependencies declared from requirements.txt)."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "MLEng Actividad1 Team" }
]
# Las dependencias no se escriben aquí: se leen de requirements.txt (ver abajo).
dynamic = ["dependencies", "optional-dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
optional-dependencies.dev = { file = ["requirements-dev.txt"] }

[tool.setuptools.packages.find]
where = ["src"]
